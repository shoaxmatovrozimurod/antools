<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/main.css">
    <title>Antools</title>
</head>

<body>
    <header class="header">
        <h1 class="visually__hidden">Sahifa haqida</h1>
        <div class="container">
            <div class="header__container">
                <a class="header__logo" href="#">
                    <img src="./images/logo.png" alt="logo" onerror="this.src='https://via.placeholder.com/40'">
                    <p class="header__text__logo">antools</p>
                </a>

                <div class="header__nav" id="headerNav">
                    <ul class="header__list">
                        <li class="header__item"><a class="header__item__link" href="#">Home</a></li>
                        <li class="header__item"><a class="header__item__link" href="#">Catagories</a></li>
                        <li class="header__item"><a class="header__item__link" href="#">My collections</a></li>
                        <li class="header__item"><a class="header__item__link" href="#">Blog</a></li>
                    </ul>
                    <div class="header__actions">
                        <button class="header__btn header__btn--login">Login</button>
                        <button class="header__btn header__btn--signup">Sign Up</button>
                    </div>
                </div>

                <div class="bars" id="menuToggle" aria-label="Menu" role="button">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>
        </div>
    </header>
    <!-- -------------------hero---------------------- -->
    <section class="hero">
        <div class="container">
            <div class="hero__container">
                <div class="hero__box">
                    <h2 class="hero__box__title">Awesome tools for Designer & Developer.</h2>
                </div>
            </div>
        </div>

    </section>

    <script src="./js/main.js"></script>
</body>

</html>
